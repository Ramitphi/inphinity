# Declares secret NAMES only. No values live in this file.
#
# Left side  = the secret id the workflow reads with runtime.getSecret({ id: "TWELVE_DATA_API_KEY" }).
# Right side = the name of the environment variable the CRE CLI reads the value from
#              (simulation: your shell or cre/.env; deployed: `cre secrets create` uploads it to the Vault DON).
secretsNames:
  TWELVE_DATA_API_KEY:
    - TWELVE_DATA_API_KEY_ENV
